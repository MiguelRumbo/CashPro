name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  HUSKY: '0'
  # Llave de EAS para com.cashpro.app (Build Credentials qvBeHpmqek). No son secretos.
  KEY_ALIAS: 'd44c8df3e59f117e436be4abbf896f0c'
  CERT_SHA256: 'B6:42:C9:3C:1B:83:9E:D9:45:CD:59:68:C7:6D:EF:32:E5:49:0E:D6:27:73:52:90:6B:86:EF:F9:F7:22:4F:03'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Validar versión y CHANGELOG
        run: |
          APP=$(node -p "require('./app.json').expo.version")
          PKG=$(node -p "require('./package.json').version")
          if [ "$APP" != "$PKG" ]; then
            echo "::error::app.json ($APP) y package.json ($PKG) no coinciden"; exit 1
          fi
          if ! grep -q "^## \[$APP\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene la sección ## [$APP]"; exit 1
          fi
          echo "version=$APP" >> "$GITHUB_OUTPUT"
      - id: tag
        name: ¿Ya se publicó esta versión?
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.read.outputs.version }}" >/dev/null; then
            echo "El tag v${{ steps.read.outputs.version }} ya existe: no se compila."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: version
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/checks.yml

  apk:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Revisar secretos y variables
        env:
          KEYSTORE: ${{ secrets.CASHPRO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CASHPRO_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CASHPRO_RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE" ] && missing="$missing CASHPRO_KEYSTORE_BASE64"
          [ -z "$STORE_PASSWORD" ] && missing="$missing CASHPRO_RELEASE_STORE_PASSWORD"
          [ -z "$KEY_PASSWORD" ] && missing="$missing CASHPRO_RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Faltan:$missing (ver docs/release.md)"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - name: Restaurar keystore
        env:
          KEYSTORE: ${{ secrets.CASHPRO_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/cashpro-release.jks"
      - run: npx expo prebuild --clean --platform android --no-install
      - name: Compilar APK firmado
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_CASHPRO_RELEASE_STORE_FILE: ${{ runner.temp }}/cashpro-release.jks
          ORG_GRADLE_PROJECT_CASHPRO_RELEASE_STORE_PASSWORD: ${{ secrets.CASHPRO_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CASHPRO_RELEASE_KEY_PASSWORD: ${{ secrets.CASHPRO_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_CASHPRO_RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon --build-cache
      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/cashpro-release.jks"
      - name: Verificar huella SHA-256 del certificado
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | awk -F': ' '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          EXPECTED=$(echo "$CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::La huella del certificado no coincide (esperada $EXPECTED, obtenida $ACTUAL)"; exit 1
          fi
          mv "$APK" "cashpro-v${{ needs.version.outputs.version }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: cashpro-v${{ needs.version.outputs.version }}.apk
          retention-days: 7

  publish:
    needs: [version, checks, apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - name: Notas desde el CHANGELOG
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
      - name: Crear o actualizar el GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
          APK: cashpro-v${{ needs.version.outputs.version }}.apk
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$APK" --title "CashPro $TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
