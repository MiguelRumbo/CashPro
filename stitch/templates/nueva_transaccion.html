<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nueva Transacción - CashPro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#20df60",
                        "primary-dark": "#16a34a",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c2e24",
                        "text-main": "#111713",
                        "text-secondary": "#64876f",
                        "expense-red": "#ff5252",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Input autofill styling override */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
        }
        
        /* Custom range slider thumb if needed later, or general overrides */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main antialiased selection:bg-primary/30">
<div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto bg-surface-light dark:bg-surface-dark shadow-2xl overflow-hidden">
<!-- Header -->
<header class="flex items-center justify-between px-4 py-4 pt-12 sticky top-0 z-20 bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-sm">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-text-main dark:text-white" style="font-size: 28px;">close</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-text-main dark:text-white">Nueva Transacción</h1>
<button class="text-sm font-semibold text-primary-dark dark:text-primary hover:opacity-80 transition-opacity">
<!-- Placeholder for symmetry or secondary action if needed, empty for now -->
</button>
</header>
<!-- Main Form Content -->
<main class="flex-1 overflow-y-auto px-6 pb-24 no-scrollbar">
<!-- Type Toggle -->
<div class="mt-4 mb-8">
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-background-light dark:bg-background-dark p-1 relative">
<!-- Active Indicator Slide Logic would go here in JS, simulating visual with checked state -->
<label class="flex-1 relative cursor-pointer h-full">
<input checked="" class="peer sr-only" name="type" type="radio" value="expense"/>
<div class="flex h-full w-full items-center justify-center rounded-lg text-sm font-medium text-text-secondary transition-all peer-checked:bg-surface-light dark:peer-checked:bg-surface-dark peer-checked:text-expense-red peer-checked:shadow-sm">
<span class="material-symbols-outlined mr-2 text-[18px]">arrow_downward</span>
                            Gasto
                        </div>
</label>
<label class="flex-1 relative cursor-pointer h-full">
<input class="peer sr-only" name="type" type="radio" value="income"/>
<div class="flex h-full w-full items-center justify-center rounded-lg text-sm font-medium text-text-secondary transition-all peer-checked:bg-surface-light dark:peer-checked:bg-surface-dark peer-checked:text-primary-dark dark:peer-checked:text-primary peer-checked:shadow-sm">
<span class="material-symbols-outlined mr-2 text-[18px]">arrow_upward</span>
                            Ingreso
                        </div>
</label>
</div>
</div>
<!-- Amount Input (Hero) -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="relative w-full text-center">
<span class="absolute top-1/2 left-4 -translate-y-1/2 text-4xl font-bold text-text-secondary opacity-30">$</span>
<input autofocus="" class="w-full bg-transparent border-none text-center text-6xl font-bold text-text-main dark:text-white placeholder-text-secondary/30 focus:ring-0 focus:outline-none p-0 caret-primary" inputmode="decimal" placeholder="0.00" type="text"/>
</div>
<p class="mt-2 text-sm font-medium text-text-secondary">MXN - Peso Mexicano</p>
</div>
<!-- Form Fields Container -->
<div class="space-y-4">
<!-- Category -->
<div class="group relative flex items-center bg-background-light dark:bg-background-dark rounded-2xl p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-light dark:bg-surface-dark text-text-main dark:text-white shadow-sm mr-4 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">category</span>
</div>
<div class="flex-1 relative">
<label class="block text-xs font-medium text-text-secondary mb-0.5">Categoría</label>
<select class="w-full bg-transparent border-none p-0 text-base font-medium text-text-main dark:text-white focus:ring-0 cursor-pointer appearance-none pr-8">
<option disabled="" selected="" value="">Seleccionar categoría</option>
<option value="food">Comida y Bebidas</option>
<option value="transport">Transporte</option>
<option value="shopping">Compras</option>
<option value="entertainment">Entretenimiento</option>
</select>
<span class="absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-text-secondary">
<span class="material-symbols-outlined">expand_more</span>
</span>
</div>
</div>
<!-- Account -->
<div class="group relative flex items-center bg-background-light dark:bg-background-dark rounded-2xl p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-light dark:bg-surface-dark text-text-main dark:text-white shadow-sm mr-4 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">account_balance_wallet</span>
</div>
<div class="flex-1 relative">
<label class="block text-xs font-medium text-text-secondary mb-0.5">Cuenta</label>
<select class="w-full bg-transparent border-none p-0 text-base font-medium text-text-main dark:text-white focus:ring-0 cursor-pointer appearance-none pr-8">
<option disabled="" selected="" value="">Seleccionar cuenta</option>
<option value="cash">Efectivo</option>
<option value="debit">Tarjeta de Débito</option>
<option value="credit">Tarjeta de Crédito</option>
</select>
<span class="absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-text-secondary">
<span class="material-symbols-outlined">expand_more</span>
</span>
</div>
</div>
<!-- Date & Time -->
<div class="flex gap-4">
<div class="group relative flex flex-1 items-center bg-background-light dark:bg-background-dark rounded-2xl p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-light dark:bg-surface-dark text-text-main dark:text-white shadow-sm mr-3 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
</div>
<div class="flex-1">
<label class="block text-xs font-medium text-text-secondary mb-0.5">Fecha</label>
<input class="w-full bg-transparent border-none p-0 text-base font-medium text-text-main dark:text-white focus:ring-0 cursor-pointer [color-scheme:light] dark:[color-scheme:dark]" type="date" value="2023-10-27"/>
</div>
</div>
<div class="group relative flex w-1/3 items-center bg-background-light dark:bg-background-dark rounded-2xl p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800">
<div class="flex-1 text-center">
<label class="block text-xs font-medium text-text-secondary mb-0.5">Hora</label>
<input class="w-full bg-transparent border-none p-0 text-base font-medium text-text-main dark:text-white focus:ring-0 cursor-pointer text-center [color-scheme:light] dark:[color-scheme:dark]" type="time" value="14:30"/>
</div>
</div>
</div>
<!-- Note -->
<div class="group relative flex items-start bg-background-light dark:bg-background-dark rounded-2xl p-4 transition-all hover:bg-gray-100 dark:hover:bg-gray-800">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-light dark:bg-surface-dark text-text-main dark:text-white shadow-sm mr-4 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">edit_note</span>
</div>
<div class="flex-1">
<label class="block text-xs font-medium text-text-secondary mb-0.5">Nota</label>
<textarea class="w-full bg-transparent border-none p-0 text-base font-medium text-text-main dark:text-white placeholder-text-secondary/50 focus:ring-0 resize-none" placeholder="Escribe una nota..." rows="2"></textarea>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="absolute bottom-0 left-0 w-full bg-surface-light dark:bg-surface-dark px-6 py-6 border-t border-gray-100 dark:border-gray-800/50 pb-8 z-10">
<button class="w-full bg-primary hover:bg-primary-dark text-black font-bold text-lg py-4 rounded-2xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">check</span>
                Guardar Transacción
            </button>
</div>
</div>
<!-- Background decoration for preview context (abstract blur) -->
<div class="fixed inset-0 -z-10 bg-gray-50 dark:bg-black overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-400/10 rounded-full blur-3xl"></div>
</div>
</body></html>
