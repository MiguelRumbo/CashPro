<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CashPro Splash Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#20df60",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white h-screen flex flex-col justify-between overflow-hidden">
<!-- Status Bar Spacer (Simulated for iOS) -->
<div class="h-12 w-full shrink-0"></div>
<!-- Main Content Area: Centered Vertically -->
<main class="flex-1 flex flex-col items-center justify-center -mt-20 px-6">
<!-- Logo Container -->
<div class="flex flex-col items-center gap-6 animate-fade-in-up">
<!-- Icon -->
<div class="relative flex items-center justify-center w-24 h-24 rounded-3xl bg-primary/10 dark:bg-primary/5 shadow-sm ring-1 ring-primary/20 backdrop-blur-sm">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 48;">
                    account_balance_wallet
                </span>
<!-- Subtle decorative glow behind icon -->
<div class="absolute -z-10 w-full h-full bg-primary/20 blur-2xl rounded-full opacity-50"></div>
</div>
<!-- Text Content -->
<div class="text-center space-y-2">
<h1 class="text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                    CashPro
                </h1>
<p class="text-slate-500 dark:text-slate-400 text-lg font-medium tracking-wide">
                    Manage simply
                </p>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full px-6 pb-12 pt-4 shrink-0">
<div class="flex flex-col gap-4">
<!-- Primary Button -->
<button class="w-full h-14 bg-primary hover:bg-[#1ccb57] active:scale-[0.98] transition-all duration-200 rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 group">
<span class="text-[#0a3518] text-lg font-bold tracking-wide">Empezar</span>
<span class="material-symbols-outlined ml-2 text-[#0a3518] group-hover:translate-x-1 transition-transform duration-300">
                    arrow_forward
                </span>
</button>
<!-- Terms / Disclaimer -->
<p class="text-center text-xs text-slate-400 dark:text-slate-500">
                Al continuar, aceptas nuestros Términos de Servicio.
            </p>
</div>
</footer>
</body></html>
