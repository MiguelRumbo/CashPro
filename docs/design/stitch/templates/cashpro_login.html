<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CashPro Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#20df60",
                        "primary-dark": "#1bc454",
                        "background-light": "#f6f8f6",
                        "background-dark": "#112116",
                        "surface-light": "#ffffff",
                        "surface-input": "#eef2ef",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center antialiased">
<!-- Mobile Container -->
<div class="relative w-full max-w-md h-full min-h-screen bg-surface-light flex flex-col overflow-hidden shadow-2xl sm:rounded-[2rem] sm:h-[850px] sm:min-h-0 sm:my-8 sm:border-[8px] sm:border-gray-900">
<!-- Status Bar Area (for visual fidelity) -->
<div class="h-12 w-full bg-surface-light shrink-0"></div>
<!-- Top Navigation -->
<div class="flex items-center justify-between px-6 pb-2 bg-surface-light">
<button class="flex items-center justify-center w-10 h-10 -ml-2 text-gray-900 rounded-full hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex items-center justify-end">
<button class="text-gray-500 text-sm font-semibold hover:text-primary transition-colors">
                    Ayuda
                </button>
</div>
</div>
<!-- Main Content Scroll Area -->
<div class="flex-1 overflow-y-auto px-6 pt-4 pb-8 flex flex-col">
<!-- Header Section -->
<div class="mb-10 mt-4">
<div class="w-12 h-12 bg-primary/20 rounded-xl flex items-center justify-center mb-6 text-primary">
<span class="material-symbols-outlined text-[28px]">account_balance_wallet</span>
</div>
<h1 class="text-gray-900 text-[32px] font-bold tracking-tight leading-tight mb-2">
                    Bienvenido
                </h1>
<p class="text-gray-500 text-base font-normal leading-relaxed">
                    Inicia sesión en CashPro para gestionar tus finanzas.
                </p>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault()">
<!-- Email Field -->
<div class="group">
<label class="block text-gray-900 text-sm font-semibold mb-2 ml-1">
                        Correo electrónico
                    </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-input text-gray-900 text-base placeholder-gray-400 rounded-2xl border-0 py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary focus:bg-white transition-all duration-200" placeholder="ejemplo@correo.com" type="email"/>
<div class="absolute left-4 text-gray-400 flex items-center pointer-events-none group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="group">
<label class="block text-gray-900 text-sm font-semibold mb-2 ml-1">
                        PIN o Contraseña
                    </label>
<div class="relative flex items-center">
<input class="w-full bg-surface-input text-gray-900 text-base placeholder-gray-400 rounded-2xl border-0 py-4 pl-12 pr-12 focus:ring-2 focus:ring-primary focus:bg-white transition-all duration-200" placeholder="••••••" type="password"/>
<div class="absolute left-4 text-gray-400 flex items-center pointer-events-none group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<button class="absolute right-4 text-gray-400 hover:text-gray-600 flex items-center justify-center w-8 h-8 rounded-full hover:bg-gray-200/50 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-3">
<a class="text-sm font-medium text-gray-500 hover:text-primary transition-colors" href="#">
                            ¿Olvidaste tu PIN?
                        </a>
</div>
</div>
<!-- FaceID / Biometric Spacer (Optional Visual Hint) -->
<div class="flex justify-center py-2">
<button class="text-gray-400 hover:text-primary transition-colors flex flex-col items-center gap-1 group" type="button">
<span class="material-symbols-outlined text-[32px] group-hover:scale-110 transition-transform">face</span>
<span class="text-[10px] uppercase tracking-wider font-semibold">Face ID</span>
</button>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-dark active:scale-[0.98] text-gray-900 text-base font-bold py-4 rounded-full shadow-lg shadow-primary/20 transition-all duration-200 mt-2 flex items-center justify-center gap-2" type="submit">
<span>Iniciar Sesión</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="flex-1"></div>
<!-- Footer -->
<div class="mt-8 text-center pb-6">
<p class="text-gray-500 text-sm">
                    ¿No tienes una cuenta? 
                    <a class="text-gray-900 font-bold hover:text-primary transition-colors ml-1" href="#">
                        Regístrate
                    </a>
</p>
</div>
<!-- Home Indicator Area -->
<div class="h-6 w-full flex justify-center items-end pb-2">
<div class="w-1/3 h-1 bg-gray-300 rounded-full"></div>
</div>
</div>
</div>
</body></html>
